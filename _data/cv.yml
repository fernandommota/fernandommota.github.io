        highlights:
          - "Built and led the data team, from 3 to 12 people across data engineering, analytics engineering and applied AI; set technical standards and mentored engineers coming from economics and business analytics."
          - "**Enterprise AI platform (LLM hub):** designed a single internal API for LLM access, with authentication, auditing and guardrails by default, plus shared endpoints for embeddings and RAG. It serves a GenAI sales-development chat that handles 200–300 conversations a day and an internal expert-search tool."
          - "**BIM analytics platform:** modeled IFC building models as graphs and loaded them into a Bronze/Silver/Gold lakehouse covering 70+ active and 50+ completed projects (700+ models), giving the BIM team cross-project indicators of model quality and clash history. Proofs of concept: [gnn_bim](https://github.com/fernandommota/gnn_bim), [graphrag_bim](https://github.com/fernandommota/graphrag_bim)."
          - "**CRM to lakehouse sync:** incremental synchronization of Microsoft Dynamics (Dataverse) data into Delta tables, which moved analytics out of the CRM and cut Dataverse storage from about 750 GB to 200 GB."
          - "**Schedule:** a declarative ingestion framework on Spark and Delta Lake (Azure Synapse) that let junior engineers add sources by configuration; it ran about 20,000 ingestion jobs a month at peak."
          - "Lakehouse on Azure Data Lake and Delta Lake, with Azure Synapse, Data Factory, Apache Spark and Airflow; Power BI reporting. Architecture work contributed to an estimated 25–35% reduction in analytics processing costs."

